name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 律师本地匿名化助手 ${{ github.ref_name }}
          files: dist/LegalAnonymizer.zip
          generate_release_notes: true
          body: |
            ## 律师用户下载

            下载 `LegalAnonymizer.zip`，解压后双击 `LegalAnonymizer.exe`。

            直接下载：
            https://github.com/ShengrenHOU/lawyer-local-anonymizer/releases/latest/download/LegalAnonymizer.zip

            只上传 `02-已匿名化-可上传AI` 里的文件给 AI。

            不要上传 `99-本地映射表-不要上传` 里的任何文件。
