name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Legal Anonymizer ${{ github.ref_name }}
          files: dist/LegalAnonymizer.zip
          generate_release_notes: true
          body: |
            ## Lawyer download

            Download `LegalAnonymizer.zip`, extract it, and double-click `LegalAnonymizer.exe`.

            Direct download:
            https://github.com/ShengrenHOU/lawyer-local-anonymizer/releases/latest/download/LegalAnonymizer.zip

            Only upload files from the uploadable AI output folder.

            Do not upload anything from the local mapping folder.
